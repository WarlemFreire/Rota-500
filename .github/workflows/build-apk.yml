name: Gerar APK do Rota 500

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Recuperar assinatura estável do APK
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rota500-debug-keystore-v1

      - name: Criar assinatura na primeira compilação
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Rota 500, OU=SOSWF, O=SOSWF, L=Nova Iguacu, ST=RJ, C=BR"
          fi

      - name: Confirmar SDK Android
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Testar motor local
        run: ./run-core-tests.sh

      - name: Compilar APK de teste
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK por sete dias
        uses: actions/upload-artifact@v4
        with:
          name: Rota500-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
